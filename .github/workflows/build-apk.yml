name: Build AR EDUPOINT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AR-EDUPOINT-WebView-FIXED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q AR-EDUPOINT-WebView-FIXED.zip -d android-build

      - name: Fix Kotlin dependency conflict
        working-directory: android-build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          fix = '''
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }
          '''

          if "resolutionStrategy.eachDependency" not in text:
              text = text + "\\n" + fix

          p.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-EDUPOINT-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
