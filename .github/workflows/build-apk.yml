name: Build AR EDUPOINT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AR-EDUPOINT-WebView-FIXED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q AR-EDUPOINT-WebView-FIXED.zip -d android-build

      - name: Fix Android project
        working-directory: android-build
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aredupoint.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aredupoint.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AREDUPOINT" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#1976D2</item>
              </style>
          </resources>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-build
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AR-EDUPOINT-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
