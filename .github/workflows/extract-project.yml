name: Extract FCM Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find v1.2 ZIP
        run: |
          ZIP_FILE="AR-EDUPOINT-FCM-FIX-v1.2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"

      - name: Extract v1.2 project
        run: |
          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "AR-EDUPOINT-FCM-FIX-v1.2.zip" -d extracted_project

          echo "ZIP extracted successfully."

      - name: Find Gradle project root
        run: |
          if [ -f "extracted_project/settings.gradle" ] || [ -f "extracted_project/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=extracted_project" >> "$GITHUB_ENV"
          else
            ROOT=$(find extracted_project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1)

            if [ -z "$ROOT" ]; then
              echo "ERROR: Gradle project root not found."
              exit 1
            fi

            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Remove old Android project
        run: |
          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f local.properties
          rm -f gradlew
          rm -f gradlew.bat

          echo "Old Android project removed."

      - name: Copy v1.2 project
        run: |
          cp -a "$PROJECT_ROOT"/. .

          echo "New v1.2 project copied."

      - name: Verify v1.2
        run: |
          echo "Checking version..."

          grep -n "versionCode\|versionName" app/build.gradle || true

          if grep -q "versionCode 3" app/build.gradle && \
             grep -q 'versionName .1.2.' app/build.gradle; then
            echo "SUCCESS: FCM v1.2 project is installed."
          else
            echo "ERROR: v1.2 verification failed."
            exit 1
          fi

      - name: Remove temporary extraction folder
        run: |
          rm -rf extracted_project

          echo "Temporary folder removed."
          echo "ZIP intentionally kept for safety."

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Install AR EDUPOINT FCM v1.2 project"
          git push
