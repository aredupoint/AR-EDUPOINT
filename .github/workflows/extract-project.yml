name: Extract FCM Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v1.2 ZIP
        run: |
          ZIP_FILE="AR-EDUPOINT-FCM-FIX-v1.2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"

      - name: Extract v1.2 project
        run: |
          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "AR-EDUPOINT-FCM-FIX-v1.2.zip" -d extracted_project

          echo "ZIP extracted successfully."

      - name: Find project root
        run: |
          if [ -f "extracted_project/settings.gradle" ] || \
             [ -f "extracted_project/settings.gradle.kts" ]; then

            echo "PROJECT_ROOT=extracted_project" >> "$GITHUB_ENV"

          else

            ROOT=$(find extracted_project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1)

            if [ -z "$ROOT" ]; then
              echo "ERROR: Gradle project root not found."
              exit 1
            fi

            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Remove old Android project
        run: |
          echo "Removing old Android project..."

          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f local.properties
          rm -f gradlew
          rm -f gradlew.bat

          echo "Old Android project removed."

      - name: Copy new FCM v1.2 project
        run: |
          echo "Copying new project..."

          # IMPORTANT:
          # Do NOT copy .github from ZIP.
          # Existing GitHub workflows remain untouched.

          rsync -a --exclude='.github/' "$PROJECT_ROOT"/ ./

          echo "New project copied."

      - name: Verify v1.2
        run: |
          echo "Checking Android version..."

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          if grep -q "versionCode 3" app/build.gradle && \
             grep -q "versionName '1.2'" app/build.gradle; then

            echo ""
            echo "======================================"
            echo "SUCCESS: FCM v1.2 VERIFIED"
            echo "versionCode = 3"
            echo "versionName = 1.2"
            echo "======================================"

          else

            echo ""
            echo "ERROR: v1.2 verification FAILED."
            exit 1

          fi

      - name: Verify notification channel fix
        run: |
          echo "Checking FCM notification configuration..."

          if grep -q "ar_edupoint_events" \
            app/src/main/java/com/aredupoint/app/MainActivity.java; then
            echo "FCM channel reference: OK"
          else
            echo "WARNING: FCM channel reference not found."
          fi

          if grep -q "default_notification_channel_id" \
            app/src/main/AndroidManifest.xml; then
            echo "Default notification channel: OK"
          else
            echo "WARNING: Default notification channel metadata not found."
          fi

      - name: Clean temporary folder
        run: |
          rm -rf extracted_project

          echo "Temporary folder removed."
          echo "ZIP has NOT been deleted."

      - name: Commit project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all project changes.
          git add -A

          # NEVER modify GitHub workflow files from this workflow.
          git restore --staged .github/workflows 2>/dev/null || true
          git restore .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo "Changes to be committed:"
          git diff --cached --stat

          git commit -m "Install AR EDUPOINT FCM v1.2 project"

          git push
