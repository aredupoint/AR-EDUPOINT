name: Extract FCM Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e

          ZIP="AR-EDUPOINT-FCM-READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          rm -rf /tmp/edupoint
          mkdir -p /tmp/edupoint

          unzip -q "$ZIP" -d /tmp/edupoint

          if [ -d "/tmp/edupoint/AR-EDUPOINT-FCM-READY" ]; then
            SRC="/tmp/edupoint/AR-EDUPOINT-FCM-READY"
          else
            SRC="/tmp/edupoint"
          fi

          cp -a "$SRC"/. .

          # Do NOT copy the Android build workflow automatically.
          rm -f ".github/workflows/build-apk.yml"

          # Remove the ZIP after extraction.
          rm -f "$ZIP"

          echo "Project extracted successfully."
          echo "Checking Android project..."
          ls -la
          ls -la app
          echo "Checking workflows..."
          ls -la .github/workflows
          
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract FCM Android project"
          git push
