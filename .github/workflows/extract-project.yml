name: Extract FCM Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check v1.2 ZIP
        run: |
          ZIP_FILE="AR-EDUPOINT-FCM-FIX-v1.2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo ""
            echo "Files currently in repository:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

      - name: Extract v1.2 ZIP
        run: |
          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "AR-EDUPOINT-FCM-FIX-v1.2.zip" -d extracted_project

          echo "ZIP extracted successfully."

      - name: Detect Gradle project root
        run: |
          if [ -f "extracted_project/settings.gradle" ] || [ -f "extracted_project/settings.gradle.kts" ]; then
            echo "PROJECT_ROOT=extracted_project" >> "$GITHUB_ENV"
            echo "Project root: extracted_project"
          else
            ROOT=$(find extracted_project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1)

            if [ -z "$ROOT" ]; then
              echo "ERROR: Gradle project root not found."
              find extracted_project -maxdepth 3 -type f | head -100
              exit 1
            fi

            echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
            echo "Project root: $ROOT"
          fi

      - name: Remove old Android project
        run: |
          echo "Removing old Android project..."

          rm -rf app
          rm -rf gradle

          rm -f build.gradle
          rm -f build.gradle.kts
          rm -f settings.gradle
          rm -f settings.gradle.kts
          rm -f gradle.properties
          rm -f local.properties
          rm -f gradlew
          rm -f gradlew.bat

          echo "Old Android project removed."

      - name: Copy new FCM v1.2 project
        run: |
          echo "Copying new FCM v1.2 project..."

          # IMPORTANT:
          # Never copy .github from the ZIP.
          # This preserves the existing GitHub Actions workflows.
          rsync -a --exclude='.github/' "$PROJECT_ROOT"/ ./

          echo "New FCM v1.2 project copied."

      - name: Verify FCM v1.2
        run: |
          echo "======================================"
          echo "Checking AR EDUPOINT Android version"
          echo "======================================"

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          grep -n "versionCode" app/build.gradle || true
          grep -n "versionName" app/build.gradle || true

          if grep -q "versionCode 3" app/build.gradle && \
             grep -q "versionName '1.2'" app/build.gradle; then

            echo ""
            echo "======================================"
            echo "SUCCESS: FCM v1.2 project verified."
            echo "versionCode = 3"
            echo "versionName = 1.2"
            echo "======================================"

          else
            echo ""
            echo "ERROR: FCM v1.2 verification failed."
            echo "Expected:"
            echo "versionCode 3"
            echo "versionName '1.2'"
            exit 1
          fi

      - name: Verify FCM notification channel fix
        run: |
          echo "Checking FCM notification channel configuration..."

          if grep -q "ar_edupoint_events" \
            app/src/main/java/com/aredupoint/app/MainActivity.java; then

            echo "SUCCESS: FCM notification channel fix found."

          else
            echo "WARNING: Could not verify channel reference in MainActivity."
          fi

          if grep -q "default_notification_channel_id" \
            app/src/main/AndroidManifest.xml; then

            echo "SUCCESS: Default notification channel metadata found."

          else
            echo "WARNING: Default notification channel metadata not found."
          fi

      - name: Remove temporary extraction folder
        run: |
          rm -rf extracted_project

          echo "Temporary extraction folder removed."
          echo "ZIP file intentionally kept."

      - name: Commit and push project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the Android project changes.
          # GitHub workflow files are deliberately excluded.
          git add app/
          git add gradle/
          git add build.gradle
          git add build.gradle.kts
          git add settings.gradle
          git add settings.gradle.kts
          git add gradle.properties
          git add gradlew
          git add gradlew.bat
          git add index.html

          # Ignore files that don't exist.
          git add -u

          if git diff --cached --quiet; then
            echo "No project changes detected."
            exit 0
          fi

          echo "Changes that will be committed:"
          git diff --cached --stat

          git commit -m "Install AR EDUPOINT FCM v1.2 project"

          git push
